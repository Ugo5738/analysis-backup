services:
  web:
    container_name: backup-app
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        # python manage.py makemigrations &&
        # python manage.py migrate &&
        daphne pabackup_service.asgi:application -b 0.0.0.0 -p 8000
      "
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - redis
    # networks:
    #   - default

  redis:
    container_name: backup-app-redis
    image: redis:latest
    # networks:
    #   - default

  celery:
    container_name: backup-app-celery
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        echo 'Waiting for backup-app and redis...';
        while ! nc -z backup-app 8000 || ! nc -z redis 6379; do
          sleep 1;
        done;
        echo 'Web and Redis are up - starting celery worker';
        celery -A pabackup_service worker --loglevel=info
      "
    volumes:
      - .:/code
    depends_on:
      - redis
#     networks:
#       - default

